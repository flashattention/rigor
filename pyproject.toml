[project]
name = "rigor"
version = "0.1.0"
description = "RIGOR — Resume Inspection with GitHub for Offer Readiness"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [{ name = "flashattention" }]
dependencies = [
    "defusedxml>=0.7",
    "pydantic>=2.9",
    "pypdf>=5",
    "pyyaml>=6.0",
    "typer>=0.12",
]

[project.optional-dependencies]
openai = ["openai>=1.50"]
anthropic = ["anthropic>=0.40"]

[project.scripts]
rigor = "rigor.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app/rigor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["app"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = [
    "RUF001", "RUF002", "RUF003",  # 한국어 문자열·주석의 전각 문자 경고
    "B008",  # typer.Option을 기본값으로 쓰는 것은 Typer의 표준 사용법
    "E501",  # 줄 길이는 ruff format이 맞춘다. 한글은 폭 2로 계산돼 사용자용 문장마다 경고가 난다
]
